name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies and no build step: the plugin is QML, and npm exists
      # here only to run node:test over the pure parsers in Model.js.
      - run: npm test
